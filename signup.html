<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRWTH Coach — Create Your Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-700: #0B7A70; --teal-600: #0D9488; --teal-500: #14B8A6; --teal-400: #2DD4BF;
    --slate-950: #0E1018; --slate-900: #1A1A2E;
    --bg: #F4F6F8; --white: #FFFFFF;
    --ink-900: #12141F; --ink-700: #2E3244; --ink-500: #6B7280; --ink-400: #9098A8;
    --line: #E4E7EC; --rose-600: #D5493A;
    --font: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink-900); -webkit-font-smoothing: antialiased;
    background: radial-gradient(circle at 85% -10%, rgba(45,212,191,0.25), transparent 55%), linear-gradient(150deg, var(--slate-900), var(--slate-950));
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  a { color: var(--teal-400); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .card { background: var(--white); border-radius: var(--radius); box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5); padding: 36px 34px; width: 400px; max-width: 100%; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; }
  .brand-name { font-weight: 700; font-size: 15px; }
  .brand-sub { font-size: 10px; color: var(--teal-700); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

  h1 { font-family: var(--font); font-weight: 700; font-size: 22px; margin: 0 0 6px; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: var(--ink-500); margin: 0 0 24px; }

  .field { margin-bottom: 14px; }
  .field label { font-size: 11.5px; font-weight: 700; color: var(--ink-700); display: block; margin-bottom: 5px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
  .field input:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .hint { font-size: 11px; color: var(--ink-400); margin-top: 4px; }

  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; margin-top: 6px;
    background: linear-gradient(135deg, var(--teal-500), var(--teal-700)); color: #fff;
    font-weight: 700; font-size: 14px; box-shadow: 0 10px 24px -10px rgba(13,148,136,0.6);
  }
  .submit-btn:disabled { opacity: 0.6; }

  .error-box { background: #FBE6E3; color: var(--rose-600); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; display: none; }
  .footer-note { text-align: center; font-size: 12.5px; color: var(--ink-500); margin-top: 20px; }
</style>
<script src="/config.js"></script>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="grwth-icon.png" alt="GRWTH Coach" class="brand-mark" style="object-fit:cover;">
    <div>
      <div class="brand-name">GRWTH Coach</div>
      <div class="brand-sub">Coach IQ Engine</div>
    </div>
  </div>

  <h1>Create your account</h1>
  <p class="subtitle">Start your own GRWTH Coach workspace — takes about a minute.</p>

  <div class="error-box" id="errorBox"></div>

  <form id="signupForm">
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="name" required placeholder="Jane Smith">
    </div>
    <div class="field" id="agencyNameField">
      <label>Agency / Team Name</label>
      <input type="text" id="agencyName" required placeholder="Smith Financial Group">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required placeholder="jane@example.com">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" id="phone" required placeholder="(555) 123-4567">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required minlength="8" placeholder="At least 8 characters">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
  </form>

  <p class="footer-note">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script>
  const API_BASE = window.GRWTH_API_BASE || localStorage.getItem('grwth_api_base') || 'https://api.grwthtech.com';
  const JOIN_TEAM_SLUG = new URLSearchParams(window.location.search).get('joinTeam');

  // Real "join an existing agency" path — hides the agency-creation
  // field entirely when someone arrives via their agency owner's real
  // team join link, and shows the actual agency name instead of a
  // generic message.
  if (JOIN_TEAM_SLUG) {
    document.getElementById('agencyNameField').style.display = 'none';
    document.getElementById('agencyName').required = false;
    fetch(`${API_BASE}/api/grwth-coach/public/team-by-slug/${JOIN_TEAM_SLUG}`, { credentials: 'include' })
      .then(res => res.json())
      .then(data => {
        const h1 = document.querySelector('h1');
        if (h1 && data.name) h1.textContent = `Join ${data.name}`;
      })
      .catch(() => {});
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    try {
      const res = await fetch(`${API_BASE}/api/grwth-coach/auth/signup`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          agencyName: JOIN_TEAM_SLUG ? undefined : document.getElementById('agencyName').value.trim(),
          joinTeamSlug: JOIN_TEAM_SLUG || undefined,
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value,
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `Signup failed (${res.status})`);
      }

      // Real fix — login is now blocked until email verification, so
      // auto-redirecting to the dashboard would just bounce them right
      // back out. Show a real "check your email" message instead.
      document.getElementById('signupForm').style.display = 'none';
      document.querySelector('.signup-card h1, h1').insertAdjacentHTML('afterend', `
        <p style="font-size:14px;color:var(--ink-500,#6B7280);line-height:1.6;">
          Check <strong>${data.email}</strong> for a verification link — you'll need to click it before you can log in.
        </p>
      `);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>
