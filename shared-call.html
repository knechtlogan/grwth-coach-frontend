<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRWTH Coach — Shared Call</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  =========================================================================
  PUBLIC SHARED CALL VIEWER — no login, no sidebar, no nav to the rest of
  the app, no delete/reshare controls. This is deliberately its own
  isolated page, not a stripped-down version of call-review.html — a
  recipient should never be able to reach anywhere else in the product
  from here, and never needs an account to see it.

  Reads ?token=<token> from the URL. If the share was restricted to
  specific emails, the API returns requiresEmail:true and this page
  prompts for an email inline — that's a lightweight check, not real
  authentication, matching the explicit requirement that recipients
  never create an account or sign in.
  =========================================================================
-->
<style>
  :root {
    --teal-700: #0B7A70; --teal-600: #0D9488; --teal-500: #14B8A6; --teal-400: #2DD4BF;
    --slate-950: #0E1018; --slate-900: #1A1A2E;
    --bg: #F4F6F8; --white: #FFFFFF;
    --ink-900: #12141F; --ink-700: #2E3244; --ink-500: #6B7280; --ink-400: #9098A8;
    --line: #E4E7EC;
    --amber-600: #C08A2E; --amber-100: #FBF1DD;
    --rose-600: #D5493A; --rose-100: #FBE6E3;
    --teal-100: #E3F5F2;
    --font-display: 'Geist', -apple-system, sans-serif;
    --font-body: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Geist Mono', monospace;
    --radius: 16px; --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(14,16,24,0.04), 0 12px 28px -14px rgba(14,16,24,0.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--font-body); color: var(--ink-900); -webkit-font-smoothing: antialiased; }

  .topbar { background: var(--white); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(155deg, var(--teal-400), var(--teal-600)); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: #06110F; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .brand-tag { font-size: 10px; color: var(--teal-600); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; margin-left: 6px; }

  .main { max-width: 780px; margin: 0 auto; padding: 28px 20px 60px; }
  .call-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-bottom: 4px; }
  .call-meta { font-size: 13px; color: var(--ink-500); margin-bottom: 24px; }

  .panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 20px 22px; margin-bottom: 16px; }
  .panel h3 { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin: 0 0 12px; }

  video { width: 100%; border-radius: var(--radius-sm); background: #000; display: block; }

  .score-ring-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .score-big { font-family: var(--font-display); font-weight: 800; font-size: 32px; }
  .score-badge { width: 92px; height: 92px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 24px -10px rgba(14,16,24,0.25); }
  .score-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; color: var(--ink-400); }

  .grade-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .grade-row:last-child { border-bottom: none; }
  .grade-letter { font-family: var(--font-mono); font-weight: 700; padding: 2px 9px; border-radius: 6px; }
  .grade-letter.A { background: var(--teal-100); color: var(--teal-700); }
  .grade-letter.B { background: var(--amber-100); color: var(--amber-600); }
  .grade-letter.C, .grade-letter.D { background: var(--rose-100); color: var(--rose-600); }

  .transcript-line { display: flex; gap: 10px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
  .transcript-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-400); flex-shrink: 0; padding-top: 2px; width: 40px; }
  .transcript-speaker { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; color: var(--teal-700); }

  .subskill { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .subskill:last-child { border-bottom: none; }
  .subskill-name { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .subskill-analysis { font-size: 12.5px; color: var(--ink-500); line-height: 1.5; }

  .empty-note { text-align: center; padding: 60px 20px; color: var(--ink-400); font-size: 14px; }
  .footer-note { text-align: center; font-size: 11.5px; color: var(--ink-400); margin-top: 30px; }

  .email-gate { max-width: 380px; margin: 100px auto; text-align: center; }
  .email-gate input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; margin: 14px 0; box-sizing: border-box; }
  .email-gate button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--teal-500), var(--teal-700)); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .email-gate .error { color: var(--rose-600); font-size: 12.5px; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="topbar">
  <img src="grwth-icon.png" alt="GRWTH Coach" class="brand-mark" style="object-fit:cover;">
  <div class="brand-name">GRWTH Coach</div>
  <div class="brand-tag">Shared Call</div>
</div>

<div class="main" id="mainContent">
  <div class="empty-note">Loading…</div>
</div>

<script>
const API_BASE = 'https://api.grwthtech.com';
const TOKEN = new URLSearchParams(window.location.search).get('token') || '';

const CATEGORY_ORDER = ['Foundations', 'Connecting & Tone', 'Situation Questions', 'Problem Awareness', 'Consequence Questions', 'Solution & Commitment', 'Objection Reframes', 'Live Call Teardown'];

function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + s.toString().padStart(2, '0');
}

async function load(email) {
  const main = document.getElementById('mainContent');
  if (!TOKEN) {
    main.innerHTML = '<div class="empty-note">This link is missing its access token.</div>';
    return;
  }
  try {
    const url = `${API_BASE}/api/grwth-coach/shared/${TOKEN}` + (email ? `?email=${encodeURIComponent(email)}` : '');
    const res = await fetch(url);
    const data = await res.json();

    if (res.status === 403 && data.requiresEmail) {
      showEmailGate(!!email);
      return;
    }
    if (!res.ok || data.error) {
      main.innerHTML = `<div class="empty-note">${data.error || "This link isn't valid."}</div>`;
      return;
    }

    render(data);
  } catch (err) {
    main.innerHTML = '<div class="empty-note">Couldn\'t load this shared call.</div>';
  }
}

function showEmailGate(wasWrong) {
  document.getElementById('mainContent').innerHTML = `
    <div class="email-gate">
      <div style="font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:8px;">This link is restricted</div>
      <p style="font-size:13px;color:var(--ink-500);">Enter the email address this was shared with to view it.</p>
      <input id="gateEmail" type="email" placeholder="you@example.com">
      <button id="gateSubmit">View Call</button>
      <div class="error" id="gateError">That email doesn't have access to this link.</div>
    </div>
  `;
  if (wasWrong) document.getElementById('gateError').style.display = 'block';
  document.getElementById('gateSubmit').addEventListener('click', () => {
    const email = document.getElementById('gateEmail').value.trim();
    if (email) load(email);
  });
}

function render(data) {
  const main = document.getElementById('mainContent');
  const s = data.sections;
  const d = new Date(data.date);
  const dateStr = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  let html = `
    <div class="call-title">${data.client}</div>
    <div class="call-meta">${data.platform} \u00b7 ${dateStr} \u00b7 Shared by ${data.advisorName}</div>
  `;

  if (s.video) {
    html += `<div class="panel">`;
    html += data.videoUrl
      ? `<video src="${data.videoUrl}" controls playsinline></video>`
      : `<div class="empty-note" style="padding:30px;">No recording available for this call.</div>`;
    html += `</div>`;
  }

  if (s.overview) {
    const scoreColor = data.score >= 80 ? 'var(--teal-700)' : data.score >= 60 ? 'var(--amber-600)' : 'var(--rose-600)';
    html += `
      <div class="panel">
        <h3>Overview</h3>
        <div class="score-ring-row">
          <div class="score-badge" style="background:${data.score >= 80 ? 'var(--teal-100)' : data.score >= 60 ? 'var(--amber-100)' : 'var(--rose-100)'};border:2.5px solid ${scoreColor};">
            <div class="score-big" style="color:${scoreColor}">${data.score ?? '\u2014'}</div>
            <div class="score-label">Coach IQ</div>
          </div>
        </div>
        <p style="font-size:13.5px;line-height:1.6;color:var(--ink-700);">${data.summary || 'No summary available.'}</p>
      </div>
    `;
  }

  if (s.coaching && data.categoryGrades) {
    html += `<div class="panel"><h3>Coaching Breakdown</h3>`;
    CATEGORY_ORDER.forEach(cat => {
      const g = data.categoryGrades[cat];
      if (!g) return;
      html += `<div class="grade-row"><span>${cat}</span><span class="grade-letter ${g.letter}">${g.letter} \u00b7 ${g.score}</span></div>`;
    });
    html += `</div>`;

    if (data.subSkillGrades && data.subSkillGrades.length > 0) {
      html += `<div class="panel"><h3>Skill Detail</h3>`;
      data.subSkillGrades.forEach(sub => {
        html += `
          <div class="subskill">
            <div class="subskill-name">${sub.name} <span class="grade-letter ${sub.letter}" style="font-size:11px;margin-left:6px;">${sub.letter}</span></div>
            <div class="subskill-analysis">${sub.analysis}</div>
          </div>
        `;
      });
      html += `</div>`;
    }
  }

  if (s.transcript && data.transcript) {
    html += `<div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;">Transcript</h3>
        <button id="copySharedTranscriptBtn" style="background:var(--white);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;color:var(--ink-700);display:flex;align-items:center;gap:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Transcript
        </button>
      </div>
      <div style="max-height:640px;overflow-y:auto;padding-right:4px;">`;
    data.transcript.forEach(t => {
      html += `
        <div class="transcript-line">
          <div class="transcript-time">${fmtTime(t.time)}</div>
          <div><div class="transcript-speaker">${t.speaker}</div>${t.text}</div>
        </div>
      `;
    });
    html += `</div></div>`;
  }

  html += `<div class="footer-note">Shared via GRWTH Coach \u2014 you're viewing exactly what was shared with you, nothing more.</div>`;

  main.innerHTML = html;

  if (s.transcript && data.transcript) {
    document.getElementById('copySharedTranscriptBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copySharedTranscriptBtn');
      const fullText = data.transcript
        .map(t => `[${fmtTime(t.time)}] ${t.speaker}: ${t.text}`)
        .join('\n\n');
      try {
        await navigator.clipboard.writeText(fullText);
        const original = btn.innerHTML;
        btn.innerHTML = 'Copied!';
        setTimeout(() => { btn.innerHTML = original; }, 1500);
      } catch (err) {
        console.error('Clipboard write failed', err);
      }
    });
  }
}

load();
</script>

</body>
</html>
