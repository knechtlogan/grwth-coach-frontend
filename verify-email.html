<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Email — GRWTH Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-700: #0B7A70; --teal-600: #0D9488; --teal-500: #14B8A6; --teal-400: #2DD4BF;
    --ink-900: #12141F; --ink-500: #6B7280; --line: #E4E7EC; --bg: #F4F6F8;
    --slate-900: #1A1A2E; --slate-950: #0E1018;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 85% -10%, rgba(45,212,191,0.25), transparent 55%), linear-gradient(150deg, var(--slate-900), var(--slate-950));
    font-family: 'Geist', -apple-system, sans-serif; color: var(--ink-900);
  }
  .card { background: #fff; border-radius: 18px; padding: 40px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5); }
  h1 { font-size: 22px; margin: 0 0 12px; letter-spacing: -0.3px; }
  p { color: var(--ink-500); font-size: 14px; line-height: 1.6; }
  .btn { display: inline-block; margin-top: 18px; background: linear-gradient(135deg, var(--teal-500), var(--teal-700)); color: #fff; text-decoration: none; padding: 12px 26px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 12px 24px -10px rgba(13,148,136,0.5); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--teal-600); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Verifying your email…</h1>
</div>

<script>
const API_BASE = 'https://api.grwthtech.com';
const token = new URLSearchParams(window.location.search).get('token');
const card = document.getElementById('card');

async function verify() {
  if (!token) {
    card.innerHTML = '<h1>Missing verification link</h1><p>This link is incomplete. Please use the exact link from your email.</p>';
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/grwth-coach/auth/verify-email`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Verification failed');

    card.innerHTML = `
      <h1>Email verified — welcome, ${data.name}!</h1>
      <p>Your account is now active. You can log in and start your free trial.</p>
      <a href="login.html" class="btn">Log In</a>
    `;
  } catch (err) {
    card.innerHTML = `<h1>Couldn't verify this email</h1><p>${err.message}</p>`;
  }
}

verify();
</script>

</body>
</html>
